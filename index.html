<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://cdnjs.cloudflare.com"
    />
    <title>File-Uploader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Main Container for Folder Selection -->
    <div class="folders-container">
      <!-- Row 1: Laboratories -->
      <div class="folder-row">
        <span class="folder-label">Laboratorios:</span>
        <div id="btn-select-labs" class="folder-btn">
          <img src="./public/folder-solid.svg" alt="folder-icon" />
        </div>
        <p id="path-display-labs" class="path-text">No seleccionado</p>
      </div>

      <!-- Row 2: Medical Studies -->
      <div class="folder-row">
        <span class="folder-label">Estudios:</span>
        <div id="btn-select-medical" class="folder-btn">
          <img src="./public/folder-solid.svg" alt="folder-icon" />
        </div>
        <p id="path-display-medical" class="path-text">No seleccionado</p>
      </div>
    </div>

    <div class="status-container">
      <div id="status-badge" class="status-badge on">
        <span class="status-indicator"></span>
        <span id="status-text">SISTEMA ACTIVO</span>
      </div>

      <div class="btns-container">
        <button id="btn-restart" type="button">Reiniciar</button>
        <button id="btn-rescan" type="button">Rescanear</button>
      </div>
    </div>

    <div class="search-container">
      <label id="search-label" for="search"
        >Buscar el link de un archivo:</label
      >
      <div class="search-input-container">
        <input id="search" type="text" placeholder="Nombre del archivo..." />
        <button id="btn-search" type="button">Buscar</button>
      </div>
    </div>

    <div class="search-results-container">
      <div id="search-result" class="result"></div>
    </div>

    <!-- Test Mode Button Container (Bottom Left) -->
    <div class="test-mode-container">
      <button id="btn-test-mode" type="button">Test Mode</button>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
